services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    volumes:
      - sqlite_data:/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Browser-side var: the browser runs on the host, not in Docker,
      # so this must stay a host-reachable URL, not the `backend` service
      # name.
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  sqlite_data:
