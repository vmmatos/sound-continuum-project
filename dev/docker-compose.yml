services:
  backend:
    build: ../backend
    ports:
      - "8080:8080"
    env_file:
      - ./.env
      - ./.secrets.env
    environment:
      - SQLITE_PATH=/data/sound-continuum.db
    volumes:
      - sqlite_data:/data

  frontend:
    build: ../frontend
    ports:
      - "5173:5173"
    env_file:
      - ./.env
    depends_on:
      - backend

volumes:
  sqlite_data:
